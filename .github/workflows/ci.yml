name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (niet ci): de lockfile heeft een pre-existende drift
      # (preact transitief) waar `npm ci` strikt op faalt; install tolereert dit.
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
